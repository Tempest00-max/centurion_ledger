<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAULT-X2 | Solaris Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
        }

        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl space-y-6">
        <div class="text-center">
            <h1
                class="text-4xl font-extrabold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-600">
                VAULT-X2</h1>
            <p class="text-[10px] tracking-[0.3em] font-bold text-slate-400 uppercase mt-1">Secure Neural Gateway</p>
        </div>

        <input type="file" id="fileInput" class="hidden">
        <div onclick="document.getElementById('fileInput').click()"
            class="border-2 border-dashed border-slate-200 rounded-[2rem] p-8 flex flex-col items-center justify-center space-y-4 cursor-pointer hover:border-cyan-400 transition-all group">
            <div class="text-center">
                <p id="fileName" class="text-slate-600 font-bold text-sm uppercase">Tap to Load File</p>
                <p class="text-[9px] text-slate-400 font-medium mt-1 uppercase tracking-widest">PNG, JPG, PDF, VAULT</p>
            </div>
        </div>

        <div class="space-y-3">
            <input type="password" id="key" placeholder="Enter Secure Key"
                class="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 outline-none text-center font-medium">
            <button id="encryptBtn"
                class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-extrabold py-4 rounded-2xl uppercase tracking-widest text-xs transition-all active:scale-95">Encrypt
                Stream</button>
            <button id="decryptBtn"
                class="w-full bg-gradient-to-r from-pink-400 to-rose-500 text-white font-extrabold py-4 rounded-2xl uppercase tracking-widest text-xs transition-all active:scale-95">Decrypt
                Stream</button>
        </div>

        <div id="terminal" class="bg-slate-900 rounded-2xl p-4 h-24 overflow-y-auto hidden">
            <p class="text-[10px] font-mono text-cyan-400" id="statusLog">> SYSTEM_READY</p>
        </div>
    </div>

    <script>
        let selectedFile = null;
        const log = (msg) => {
            document.getElementById('terminal').classList.remove('hidden');
            document.getElementById('statusLog').innerHTML += `<br>> ${msg}`;
        };

        document.getElementById('fileInput').onchange = (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('fileName').innerText = "LOCKED: " + selectedFile.name;
                log("FILE_LOADED: " + selectedFile.name);
            }
        };

        async function process(action) {
            const key = document.getElementById('key').value;
            if (!selectedFile || !key) return alert("MISSING DATA/KEY");

            log(`INITIATING_${action.toUpperCase()}...`);
            const fd = new FormData();
            fd.append('file', selectedFile);
            fd.append('key', key);

            try {
                const res = await fetch(`http://127.0.0.1:5000/${action}`, { method: 'POST', body: fd });
                if (!res.ok) throw new Error(await res.text());

                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = action === 'encrypt' ? selectedFile.name + ".vault" : selectedFile.name.replace('.vault', '');
                a.click();
                log(`${action.toUpperCase()}_SUCCESS`);
            } catch (e) {
                log("CRITICAL_ERROR: " + e.message);
                alert(e.message);
            }
        }

        document.getElementById('encryptBtn').onclick = () => process('encrypt');
        document.getElementById('decryptBtn').onclick = () => process('decrypt');
    </script>
</body>

</html>
