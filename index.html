<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAULT-X2 | Hybrid Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&family=JetBrains+Mono&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background 0.5s ease;
        }

        .solaris-italic {
            font-style: italic;
        }

        .dark .hover-glow:hover {
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.15);
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-6 bg-[#f8fafc] dark:bg-[#0f172a] text-[#1e293b] dark:text-[#f8fafc]">

    <!-- 🌓 Theme Toggle Button -->
    <button onclick="toggleTheme()"
        class="fixed top-6 right-6 w-12 h-12 rounded-full bg-white dark:bg-slate-800 shadow-xl flex items-center justify-center border border-slate-200 dark:border-slate-700 z-50">
        <span id="themeIcon" class="text-xl">🌙</span>
    </button>

    <div
        class="bg-white/90 dark:bg-slate-900/80 backdrop-blur-xl w-full max-w-lg rounded-[3rem] p-10 space-y-8 relative overflow-hidden shadow-2xl border border-slate-100 dark:border-slate-800">

        <!-- 🌐 Dynamic Headers -->
        <div class="text-center space-y-2">
            <div class="hidden dark:block">
                <h1
                    class="text-4xl font-extrabold italic tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-cyan-400 via-blue-500 to-indigo-600 solaris-italic">
                    VAULT-X2
                </h1>
                <p class="text-[10px] tracking-[0.4em] font-black text-cyan-500/50 uppercase">Solaris Elite Interface
                </p>
            </div>
            <div class="dark:hidden block">
                <h1 class="text-4xl font-extrabold tracking-tighter text-cyan-500">VAULT-X2</h1>
                <p class="text-[10px] tracking-[0.3em] font-bold text-slate-400 uppercase mt-1">Secure Neural Gateway
                </p>
            </div>
        </div>

        <!-- File Input Drop Zone -->
        <div id="dropZone"
            class="border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-[2.5rem] p-12 flex flex-col items-center justify-center space-y-4 cursor-pointer hover-glow transition-all duration-300 group">
            <div
                class="w-16 h-16 bg-slate-100 dark:bg-slate-800/50 rounded-3xl flex items-center justify-center group-hover:scale-110 transition-transform">
                <svg class="w-8 h-8 text-slate-400 dark:text-slate-500 group-hover:text-cyan-400" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
            </div>
            <div class="text-center">
                <p id="fileName"
                    class="text-slate-600 dark:text-slate-400 font-bold text-sm tracking-tight uppercase group-hover:text-cyan-500">
                    Initialize Data Stream</p>
                <p class="text-[9px] text-slate-400 dark:text-slate-600 font-bold mt-1 tracking-[0.2em]">TAP TO LOAD</p>
            </div>
            <input type="file" id="fileInput" class="hidden">
        </div>

        <!-- Key Input and Hybrid Buttons -->
        <div class="space-y-4">
            <input type="password" id="key" placeholder="ACCESS_KEY"
                class="w-full bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700 rounded-2xl px-6 py-5 outline-none focus:border-cyan-500/50 font-mono text-cyan-600 dark:text-cyan-400 transition-all text-center tracking-widest uppercase text-xs">
            <div class="grid grid-cols-2 gap-4">
                <button id="encryptBtn"
                    class="bg-cyan-500 text-white dark:text-slate-950 font-black py-5 rounded-2xl active:scale-95 transition-all uppercase text-[11px] tracking-tight hover:shadow-[0_0_20px_rgba(34,211,238,0.3)]">
                    Encrypt Stream
                </button>
                <button id="decryptBtn"
                    class="bg-pink-500 text-white dark:bg-transparent dark:border dark:border-rose-500/40 dark:text-rose-400 font-black py-5 rounded-2xl active:scale-95 transition-all uppercase text-[11px] tracking-tight hover:bg-rose-500/10">
                    Decrypt Stream
                </button>
            </div>
        </div>

        <!-- Terminal Output Area -->
        <div id="terminal"
            class="bg-slate-900/10 dark:bg-black/30 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 h-32 overflow-y-auto hidden">
            <div class="font-mono text-[10px] space-y-1" id="statusLog">
                <p class="text-slate-400 dark:text-cyan-500/30">>> STANDBY</p>
            </div>
        </div>
    </div>

    <script>
        // 🌓 Theme Logic
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.innerText = '🌙';
                localStorage.theme = 'light';
            } else {
                html.classList.add('dark');
                icon.innerText = '☀️';
                localStorage.theme = 'dark';
            }
        }

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').innerText = '☀️';
        }

        // 🧠 Core Backend Integration
        const API_BASE_URL = "https://vault-backend-ftsk.onrender.com/process-file";
        let selectedFile = null;

        const log = (msg, type = 'info') => {
            const terminal = document.getElementById('terminal');
            const logArea = document.getElementById('statusLog');
            terminal.classList.remove('hidden');
            const colors = { info: 'text-cyan-600 dark:text-cyan-400', success: 'text-emerald-500', error: 'text-rose-500' };
            logArea.innerHTML += `<p class="${colors[type]} tracking-tight">>> ${msg}</p>`;
            terminal.scrollTop = terminal.scrollHeight;
        };

        const dz = document.getElementById('dropZone');
        dz.onclick = () => document.getElementById('fileInput').click();
        document.getElementById('fileInput').onchange = e => {
            selectedFile = e.target.files[0];
            document.getElementById('fileName').innerText = selectedFile.name;
            document.getElementById('fileName').style.color = '#22d3ee';
            log(`FILE_CAPTURED: ${selectedFile.name.toUpperCase()}`);
        };

        async function process(action) {
            const password = document.getElementById('key').value;
            if (!selectedFile || !password) return log("ABORT: DATA_OR_KEY_MISSING", 'error');

            log(`INITIATING_${action.toUpperCase()}...`);

            const fd = new FormData();
            fd.append('file', selectedFile);
            fd.append('password', password);
            fd.append('mode', action);

            try {
                // Note: First request may take 50s to "wake up" Render
                const res = await fetch(API_BASE_URL, { method: 'POST', body: fd });

                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "CONNECTION_FAILED");
                }

                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);

                // Set correct download filename
                const outName = action === 'encrypt' ? selectedFile.name + ".vx2" : selectedFile.name.replace('.vx2', '');
                a.download = outName;

                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                log(`${action.toUpperCase()}_SUCCESSFUL`, 'success');
            } catch (e) {
                log("CRITICAL_FAILURE: " + e.message, 'error');
            }
        }

        document.getElementById('encryptBtn').onclick = () => process('encrypt');
        document.getElementById('decryptBtn').onclick = () => process('decrypt');
    </script>
</body>

</html>
